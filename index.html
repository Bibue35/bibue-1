<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bibue - Discover Anime & Manga</title>
    <meta name="description" content="Discover your next favorite anime and manga with Bibue. Track your watchlist, explore trending titles, and connect with the community." />
    <meta name="author" content="Bibue" />

    <meta property="og:title" content="Bibue - Discover Anime & Manga" />
    <meta property="og:description" content="Discover your next favorite anime and manga with Bibue." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://s4.anilist.co" crossorigin />
    <link rel="dns-prefetch" href="https://s4.anilist.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Critical fonts - loaded as non-blocking stylesheets via media trick -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" /></noscript>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" /></noscript>

    <!-- Google AdSense - deferred until after page is interactive -->
    <script>
      if ('requestIdleCallback' in window) {
        requestIdleCallback(function() {
          var s = document.createElement('script');
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2458670095989987';
          s.crossOrigin = 'anonymous';
          s.async = true;
          document.head.appendChild(s);
        });
      } else {
        setTimeout(function() {
          var s = document.createElement('script');
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2458670095989987';
          s.crossOrigin = 'anonymous';
          s.async = true;
          document.head.appendChild(s);
        }, 3000);
      }
    </script>

    <!-- Noto Sans JP - lazy loaded after page load since it's 150KB+ CSS and 100% unused on initial paint -->
    <script>
      window.addEventListener('load', function() {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&text=%E3%81%82-%E3%82%93%E3%82%A2-%E3%83%B3%E4%B8%80-%E9%BE%A0&display=swap';
        document.head.appendChild(link);
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
